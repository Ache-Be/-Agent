# 教学预警系统后端配置
initialized: true
app:
  name: "教学预警系统 API"
  version: "1.0.0"
  host: "0.0.0.0"
  port: 9090
  env: "dev"
  api_prefix: "/api"
  reload: true
  api_status_enabled: true
  secret_key: "teaching-warning-system-secret-key-2026"
upload:
  max_size_mb: 16
  allow_ext: [".csv", ".docx", ".xlsx"]
  upload_dir: "uploads"
  report_dir: "uploads/reports"
  temp_dir: "uploads/_temp"
conv:
  max_conversations: 50
  history_keep_last: 20
report:
  max_txt_archive: 3000
knowledge:
  csv_path: "../data/knowledge/knowledge_base.csv"
  backup_dir: "../data/knowledge/backups"
  backup_max: 20
logging:
  dir: "logs"
  max_bytes_mb: 10
  backup_count: 3
cors:
  origins:
    - "http://localhost:5173"
    - "http://localhost:9090"
    - "*"
# ============ PostgreSQL + pgvector ============
database:
  host: "127.0.0.1"
  port: 5432
  user: "postgres"
  password: "JGYjw820125"
  database: "teaching_warning"
  # 连接池参数
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  echo: false
# ============ Embedding 模型配置 ============
embedding:
  provider: "sentence_transformers"
  model_name: "D:/A教育agent/data/models/bge-small-zh-v1.5"
  vector_dim: 512
  max_seq_length: 512
  batch_size: 64
  cache_dir: "../data/models"
# ============ 数据清洗规则 ============
cleaning:
  # 配置型的老师名黑名单，行中姓名命中则标记为 teacher 不入库
  teacher_names:
    - "卢冶"
  # 班级标题行/噪声行关键词
  noise_keywords:
    - "学号"
    - "姓名"
    - "班级"
    - "实验"
    - "班级名称"
    - "class"
    - "student"
    - "name"
    - "总分"
    - "平均分"
    - "正确率"
    - "序号"
    - "排名"
    - "实验报告"
  # 学号格式正则（头歌/MOOC/随堂常见），命中视为学生行的强特征
  student_id_regex:
    - "^20\\d{6,10}$"
    - "^\\d{8,12}$"
  # 姓名长度范围
  name_len_range: [2, 4]
