<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题目知识点匹配 | 教学预警系统</title>
    <link rel="stylesheet" href="/static/css/common.css">
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <h1>教学预警系统</h1>
            <div class="header-links">
                <a href="{{ url_for('index') }}">&larr; 返回上传</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="report-title">
            {{ report_title }}
            <span class="badge badge-question">题目匹配</span>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="value">{{ total_questions }}</div>
                <div class="label">解析题目数</div>
            </div>
            <div class="stat-card">
                <div class="value">{{ matched_count }}</div>
                <div class="label">已匹配知识点</div>
            </div>
            <div class="stat-card">
                <div class="value">{{ unmatched_count }}</div>
                <div class="label">未匹配</div>
            </div>
            <div class="stat-card">
                <div class="value">{{ "%.0f" | format(matched_count / total_questions * 100 if total_questions > 0 else 0) }}%</div>
                <div class="label">匹配率</div>
            </div>
        </div>

        <!-- 报告内容 -->
        <div class="report-card">
            <div class="toolbar">
                <span>详细分析报告</span>
                <div class="toolbar-actions">
                    <a href="{{ url_for('download_report', filename=report_filename) }}">
                        &#128229; 下载报告
                    </a>
                </div>
            </div>
            <div class="report-content">{{ report_content }}</div>
        </div>
    </div>

    <div class="footer">
        教学预警系统 v0.2
    </div>
</body>
</html>
