<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ report_title }} | 教学预警系统</title>
    <link rel="stylesheet" href="/static/css/common.css">
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <h1>教学预警系统</h1>
            <div class="header-links">
                <a href="javascript:history.back()">&larr; 返回</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="report-card">
            <div class="toolbar">
                <span>{{ report_title }}</span>
                <div class="toolbar-actions">
                    <a href="{{ url_for('download_report', filename=report_filename) }}">&#128229; 下载报告</a>
                </div>
            </div>
            <div class="report-content">{{ report_content }}</div>
        </div>
    </div>

    <div class="footer">教学预警系统 v0.2</div>
</body>
</html>
